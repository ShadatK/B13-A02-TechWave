<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>TechWave</title>
</head>

<body class="inter-font">
    <header>
        <nav class="navbar bg-[#1A0B2E] text-white flex justify-around items-center py-6 border-b-2 border-[#412567]">
            <h2 class="text-5xl font-bold">Tech<span
                    class="bg-linear-to-tr from-[#F7E93F] via-[#FB09B4] to-[#9100F8] bg-clip-text text-transparent">Wave</span>
            </h2>
            <ul class="menu flex gap-8">
                <li class="text-lg font-medium leading-[120%]">About</li>
                <li class="text-lg font-medium leading-[120%]">Episodes</li>
                <li class="text-lg font-medium leading-[120%]">Host</li>
            </ul>
            <button
                class="text-lg font-semibold px-4 py-3 rounded-3xl bg-linear-to-tr from-[#F7E93F] via-[#FB09B4] to-[#9100F8]">Subscribe
                <i class="fa-solid fa-arrow-right fa-sm"></i>
            </button>
        </nav>

        <div class="banner text-white">
            <div class="banner-content w-137.5 mx-auto py-24 text-center">
                <div class="flex justify-center align-middle">
                    <img src="assets/microphone.png" alt="Mic logo">
                </div>
                <h1 class="text-6xl font-extrabold">TechWave</h1>
                <p class="text-lg font-normal opacity-80 mt-2 mb-6">Your daily dose of tech insights, productivity
                    hacks, and personal growth</p>
                <div class="flex flex-row gap-2 justify-center items-center">
                    <button class="text-lg font-semibold px-4 py-3 rounded-3xl bg-linear-to-tr from-[#F7E93F] via-[#FB09B4] to-[#9100F8]">
                        <img class="inline" src="assets/spotify.png" alt="Spotify icon"> Listen on Spotify</button>
                    <button class="text-lg font-semibold text-[#00FF88] px-4 py-3 border-2 border-[#00FF88] rounded-3xl">
                        <img class="inline" src="assets/message.png" alt="Message icon"> Subscribe</button>
                </div>
            </div>
        </div>
    </header>

    <main></main>

    <footer></footer>
</body>

</html>
